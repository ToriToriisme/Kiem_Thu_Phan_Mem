# ============================================================================
# 🐎 Horse Racing Management - CI/CD Pipeline
# ============================================================================
# Pipeline: Build → Test → Deploy
#   - Backend:  Java 26 / Spring Boot 4.x / Maven / MongoDB
#   - Frontend: Node 22 / React 19 / Vite 8
# ============================================================================

name: 🐎 Horse Racing CI/CD Pipeline

on:
  push:
    branches: [ main, KCPM_Sprint_1, SRS ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '26'
  NODE_VERSION: '22'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 🔨 Stage 1: Build
  # ──────────────────────────────────────────────────────────────────────────
  build-backend:
    name: 🔨 Build Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-horse-racing-management

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 📦 Build with Maven (skip tests)
        run: ./mvnw clean package -DskipTests -B

      - name: 💾 Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend-horse-racing-management/target/*.jar
          retention-days: 7

  build-frontend:
    name: 🔨 Build Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-horse-racing-management

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-horse-racing-management/package.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 💾 Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-horse-racing-management/dist
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 🧪 Stage 2: Test
  # ──────────────────────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Test Backend (JUnit 5 + Mockito)
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: backend-horse-racing-management

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run unit tests
        run: ./mvnw test -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/horse_racing_test_db
          SPRING_DATA_MONGODB_DATABASE: horse_racing_test_db

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-horse-racing-management/target/surefire-reports/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 🚀 Stage 3: Deploy (only on push to main)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [ test-backend, build-frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: deploy/backend

      - name: 📦 Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: deploy/frontend

      - name: 📋 List deployment artifacts
        run: |
          echo "===== 🐎 Deployment Artifacts ====="
          echo ""
          echo "📦 Backend JAR:"
          ls -lh deploy/backend/
          echo ""
          echo "📦 Frontend Dist:"
          ls -lh deploy/frontend/
          echo ""
          echo "✅ All artifacts ready for deployment!"

      # ─── Uncomment and configure one of the following deploy targets ───
      #
      # Option A: Deploy to a VPS via SSH
      # - name: 🚀 Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd /opt/horse-racing
      #       ./deploy.sh
      #
      # Option B: Deploy to Docker Hub
      # - name: 🐳 Build & Push Docker Image
      #   run: |
      #     docker build -t ${{ secrets.DOCKER_USERNAME }}/horse-racing-backend:${{ github.sha }} .
      #     docker push ${{ secrets.DOCKER_USERNAME }}/horse-racing-backend:${{ github.sha }}
      #
      # Option C: Deploy Frontend to GitHub Pages
      # - name: 🌐 Deploy Frontend to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: deploy/frontend

      - name: ✅ Deployment summary
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║  🐎 Horse Racing Management             ║"
          echo "║  ✅ Deployment pipeline completed!       ║"
          echo "║                                          ║"
          echo "║  Branch: ${{ github.ref_name }}          ║"
          echo "║  Commit: ${{ github.sha }}               ║"
          echo "║  Actor:  ${{ github.actor }}              ║"
          echo "╚══════════════════════════════════════════╝"
