server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Quan trọng cho React Router: khi người dùng vào thẳng 1 URL con
    # (vd /tournaments) hoặc bấm F5, Nginx phải trả về index.html
    # thay vì báo 404, để React Router tự xử lý route ở phía client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}